project:
  type: website
  output-dir: _site

website:
  title: "CS Notes"
  description: "Personal notes from CMU 24-887 Machine Learning & AI for Engineers, and beyond."
  site-url: "https://panjunbiao.github.io/cs-notes"
  repo-url: "https://github.com/panjunbiao/cs-notes"
  repo-actions: [source, edit, issue]
  page-navigation: true
  navbar:
    left:
      - href: index.qmd
        text: Home
      - text: "Notes"
        menu:
          - href: notes/logistic-regression/index.qmd
            text: Logistic Regression
    right:
      - icon: github
        href: https://github.com/panjunbiao/cs-notes
        aria-label: GitHub
  sidebar:
    style: docked
    search: true
    contents:
      - section: "Machine Learning"
        contents:
          - section: "Logistic Regression"
            href: notes/logistic-regression/index.qmd
            contents:
              - section: "Two-Class, Two-Feature Linear Classifier"
                href: notes/logistic-regression/two-class-linear/index.qmd
                contents:
                  - text: "NumPy demo (from scratch)"
                    href: notes/logistic-regression/two-class-linear/demo.ipynb
  page-footer:
    center: |
      Notes from CMU
      [24-887 Machine Learning & AI for Engineers](https://www.cmu.edu/online/ai-engineering-fundamentals).
      Content credit: the instructor and Carnegie Mellon University.

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    grid:
      sidebar-width: 320px
    toc: true
    toc-depth: 3
    number-sections: false
    html-math-method: mathjax
    code-copy: true
    code-overflow: wrap
