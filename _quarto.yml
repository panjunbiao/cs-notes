project:
  type: website
  output-dir: _site

website:
  title: "CS Notes"
  description: "Personal study notes on machine learning, AI, and the math behind them."
  site-url: "https://panjunbiao.github.io/cs-notes"
  repo-url: "https://github.com/panjunbiao/cs-notes"
  repo-actions: [source, edit, issue]
  page-navigation: true
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: learning-path.qmd
        text: Learning Path
      - text: "Notes"
        menu:
          - href: notes/logistic-regression/index.qmd
            text: Logistic Regression
          - href: notes/support-vector-machine/index.qmd
            text: Support Vector Machine
          - href: notes/neural-networks/index.qmd
            text: Neural Networks
          - text: "---"
          - href: notes/calculus-1/index.qmd
            text: Calculus I
    right:
      - icon: github
        href: https://github.com/panjunbiao/cs-notes
        aria-label: GitHub
  sidebar:
    style: docked
    search: true
    contents:
      - section: "Machine Learning"
        contents:
          - section: "Logistic Regression"
            href: notes/logistic-regression/index.qmd
            contents:
              - section: "Two-Class, Two-Feature Linear Classifier"
                href: notes/logistic-regression/two-class-linear/index.qmd
                contents:
                  - text: "NumPy demo (from scratch)"
                    href: notes/logistic-regression/two-class-linear/demo.ipynb
          - section: "Support Vector Machine"
            href: notes/support-vector-machine/index.qmd
            contents:
              - text: "Hard-Margin Linear SVM"
                href: notes/support-vector-machine/hard-margin-linear/index.qmd
              - text: "Kernels: a visual tour"
                href: notes/support-vector-machine/kernel-boundaries/index.ipynb
          - section: "Neural Networks"
            href: notes/neural-networks/index.qmd
            contents:
              - section: "Forward Propagation & Activations"
                href: notes/neural-networks/forward-propagation/index.qmd
                contents:
                  - text: "NumPy demo (from scratch)"
                    href: notes/neural-networks/forward-propagation/demo.ipynb
              - text: "Depth, width & activation study"
                href: notes/neural-networks/architecture-study/index.ipynb
              - text: "What do the weights mean?"
                href: notes/neural-networks/weights-study/index.ipynb
              - section: "Backpropagation"
                href: notes/neural-networks/backpropagation/index.qmd
                contents:
                  - text: "NumPy demo (from scratch)"
                    href: notes/neural-networks/backpropagation/demo.ipynb
      - section: "Mathematics"
        contents:
          - section: "Calculus I (UND Math 165)"
            href: notes/calculus-1/index.qmd
            contents:
              - text: "Chapter 1 — Limits"
                href: notes/calculus-1/limits/index.qmd
              - text: "Chapter 2 — Derivatives"
                href: notes/calculus-1/derivatives/index.qmd
              - text: "Quick reference"
                href: notes/calculus-1/quick-reference/index.qmd
  page-footer:
    center: |
      Personal study notes. Course and textbook credits are given on each page.

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    grid:
      sidebar-width: 320px
    toc: true
    toc-depth: 3
    number-sections: false
    html-math-method: mathjax
    code-copy: true
    code-overflow: wrap
